openapi: 3.0.3
info:
  title: Emitta · API para integrar tu aplicación
  version: 1.0.0
  description: >-
    Empieza por la [guía paso a
    paso](https://emitta.nexorf.dev/docs/quickstart/). Esta referencia es un
    catálogo de campos y respuestas, no un panel para clientes.


    Base TEST: https://api-emitta.nexorf.dev. Obtén un token con
    clientId/clientSecret; usa Authorization: Bearer en las operaciones
    protegidas. No envíes el UUID de tenant.


    Orden: autenticación → negocio y puntos → certificado → factura → estado →
    XML/PDF. Los UUID los devuelve la API. Conserva el id de la factura como
    documentId.


    El procesamiento fiscal automático está apagado en staging. HTTP 202 sólo
    confirma persistencia. No hay webhooks ni registro público. Las solicitudes
    interactivas están deshabilitadas para evitar operaciones accidentales.
servers:
  - url: https://api-emitta.nexorf.dev
    description: Staging; fiscal processing and SRI transmission disabled
  - url: http://localhost:18080
    description: Local development
tags:
  - name: 1. Obtener acceso
  - name: 2. Configurar negocio y puntos
  - name: 3. Gestionar el certificado
  - name: 4. Crear una factura
  - name: 5. Consultar y descargar
paths:
  /api/v1/auth/token:
    post:
      tags:
        - 1. Obtener acceso
      operationId: issueAccessToken
      summary: Obtener un token
      description: |
        Authenticates an API client using its client identifier and secret.

        Successful authentication returns a short-lived RS256 JWT.
        This endpoint is intentionally public because it is the authentication
        entry point.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: Access token issued
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Invalid client credentials
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          $ref: "#/components/responses/TrafficLimited"
        "503":
          $ref: "#/components/responses/TemporarilyUnavailable"
  /api/v1/fiscal-configuration:
    post:
      tags:
        - 2. Configurar negocio y puntos
      operationId: configureOwnFiscalIssuer
      summary: Registrar emisor, local y punto
      description: Requires taxpayers:write, establishments:write and
        points-of-issue:write. Tenant comes exclusively from JWT. Transactional;
        concurrent identical requests reuse natural keys. Different supplied
        data or inactive records return 409 without changes. Does not import a
        certificate, activate workers or submit to SRI.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FiscalConfigurationRequest"
      responses:
        "200":
          description: Created or identified configuration; use pointOfIssueId for invoices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FiscalConfigurationResult"
        "400":
          description: Invalid taxpayer data or codes; codes have exactly three digits
        "401":
          description: Authentication required
        "403":
          description: Missing permissions or inactive account
        "409":
          description: Existing configuration differs or is inactive; no changes committed
    get:
      tags:
        - 2. Configurar negocio y puntos
      operationId: readOwnFiscalConfiguration
      summary: Consultar códigos y UUID de mis puntos
      description: Requires certificates:read. Only the JWT tenant is queried.
        Metadata alone does not attest current trust or readiness to emit.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Paginated configurations; no secrets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FiscalConfigurationEntry"
        "401":
          description: Authentication required
        "403":
          description: Permission required
  /api/v1/taxpayers/{taxpayerId}/certificates:
    parameters:
      - name: taxpayerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - 3. Gestionar el certificado
      operationId: listCertificateMetadata
      summary: Consultar estado y vigencia del certificado
      security:
        - bearerAuth: []
      description: Requires certificates:read and taxpayer ownership, or
        platform:admin for the selected taxpayer. No PKCS#12, password or
        private key is returned.
      responses:
        "200":
          description: Metadata only; Cache-Control no-store
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    fingerprint:
                      type: string
                    status:
                      type: string
                    validUntil:
                      type: string
                      format: date-time
        "401":
          description: Authentication required
        "403":
          description: Missing scope or different tenant
    post:
      tags:
        - 3. Gestionar el certificado
      operationId: registerReviewedCertificate
      summary: Importar el certificado del negocio
      description: Requires certificates:write and taxpayer ownership, or
        platform:admin for the selected taxpayer. Explicitly enabled by the
        operator. Server-owned CA trust and current CRLs, certified RUC and
        administrative authorization review are mandatory. Does not activate
        signing or SRI transmission. Previous document certificate snapshots
        remain intact. Evidence hash alone is not legal proof; retain the
        reviewed evidence privately.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - certificate
                - password
                - authorizationEvidence
                - authorizationReviewed
              properties:
                certificate:
                  type: string
                  format: binary
                  description: PKCS#12, maximum 1 MiB
                password:
                  type: string
                  format: password
                  maxLength: 1024
                  writeOnly: true
                alias:
                  type: string
                  maxLength: 255
                authorizationEvidence:
                  type: string
                  format: binary
                  description: Reviewed authority evidence, maximum 256 KiB; only SHA-256 retained
                authorizationReviewed:
                  type: boolean
                  enum:
                    - true
      responses:
        "201":
          description: AES-GCM encrypted registration; response contains only metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  fingerprint:
                    type: string
                    pattern: ^[a-f0-9]{64}$
                  validUntil:
                    type: string
                    format: date-time
        "400":
          description: Invalid upload or unreviewed authority
        "401":
          description: Authentication required
        "403":
          description: Missing scope or different tenant
        "404":
          description: Administration disabled or active TEST taxpayer not found
        "413":
          description: Upload too large
        "422":
          description: Invalid key
          password: null
          validity: null
          chain: null
          revocation or certified RUC: null
        "503":
          description: Server CA or CRL configuration unavailable
  /api/v1/invoices:
    post:
      tags:
        - 4. Crear una factura
      operationId: createInvoice
      summary: Crear una factura y obtener su documentId
      description: >
        Creates an immutable invoice business snapshot and queues it

        for asynchronous fiscal processing.


        The authenticated JWT determines the tenant. A tenant identifier

        must never be supplied by the request body.


        Requires scope invoices:write and an active JWT tenant.

        The Idempotency-Key header is mandatory. Processing is disabled by
        default;

        an operator must enable the worker and outbox publisher explicitly.


        A new invoice returns 202 Accepted.


        An exact replay using the same Idempotency-Key returns 200 OK

        and the existing invoice resource.
      security:
        - bearerAuth: []
      x-required-scopes:
        - invoices:write
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: |
            Tenant-scoped idempotency key. Reusing the same key with
            different business content returns 409 Conflict.
          schema:
            type: string
            minLength: 1
            maxLength: 255
          example: sale-2026-000001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvoiceRequest"
            examples:
              standardInvoice:
                summary: Standard 15 percent VAT invoice
                value:
                  pointOfIssueId: 4e10fa1e-b488-48ec-a79e-364eb434ef58
                  environment: TEST
                  issuedAt: 2026-10-05T20:00:00Z
                  buyer:
                    identificationType: "07"
                    identification: "9999999999999"
                    name: CONSUMIDOR FINAL
                  items:
                    - sku: P001
                      description: Producto de prueba
                      quantity: 2
                      unitPrice: 10
                      discount: 2
                      taxes:
                        - taxCode: "2"
                          percentageCode: "4"
                          rate: 15
                  payments:
                    - paymentMethod: "01"
                      total: 20.7
                  expectedTotal: 20.7
      responses:
        "200":
          description: |
            Idempotent replay. The invoice already existed and the
            supplied business content matched the original request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateInvoiceResponse"
        "202":
          description: |
            Invoice persisted and accepted for asynchronous fiscal processing.
            This does not mean that the SRI has authorized the invoice.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateInvoiceResponse"
        "400":
          description: Malformed request or transport-level validation failure
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Missing or invalid authentication
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: Authenticated client is not allowed to perform the operation
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Fiscal resource was not found in the authenticated tenant
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: Idempotency key was reused with different request content
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "422":
          description: |
            Request is structurally valid but violates a fiscal or
            business invariant, such as expectedTotal mismatch.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          $ref: "#/components/responses/TrafficLimited"
        "503":
          description: |
            Temporary admission saturation. ADMISSION_SATURATED is returned
            before committing a new document. Retry the identical request
            with the same idempotency key; existing replays remain available.
            A transport timeout or any other server error does not prove that
            no commit occurred. Reconcile by replaying the identical request
            and key; never create a replacement invoice with a new key.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Suggested delay in seconds
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/documents/{documentId}:
    get:
      tags:
        - 5. Consultar y descargar
      operationId: getDocument
      summary: Consultar el estado de una factura
      security:
        - bearerAuth: []
      x-required-scopes:
        - documents:read
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Document status; never includes internal object storage paths
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  status:
                    type: string
                  accessKey:
                    type: string
                    nullable: true
                  sequential:
                    type: integer
                    format: int64
                    nullable: true
                  environment:
                    type: string
                    enum:
                      - TEST
                      - PRODUCTION
                  issuedAt:
                    type: string
                    format: date-time
                  authorizedAt:
                    type: string
                    format: date-time
                    nullable: true
        "400":
          description: Resource unavailable or request rejected
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Resource unavailable or request rejected
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: Resource unavailable or request rejected
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Resource unavailable or request rejected
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          $ref: "#/components/responses/TrafficLimited"
        "503":
          $ref: "#/components/responses/TemporarilyUnavailable"
  /api/v1/documents/{documentId}/artifacts/{type}:
    get:
      tags:
        - 5. Consultar y descargar
      operationId: downloadDocumentArtifact
      summary: Descargar XML autorizado o PDF RIDE
      description: Requires confirmed AUTHORIZED state and enabled artifact loading.
        Checks tenant ownership before accessing object storage and verifies
        persisted SHA-256. RIDE may not exist yet. This GET never generates or
        submits a document.
      security:
        - bearerAuth: []
      x-required-scopes:
        - artifacts:read
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum:
              - authorized-xml
              - ride-pdf
      responses:
        "200":
          description: Private artifact attachment
          headers:
            ETag:
              description: Quoted SHA-256
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
              example: no-store
            Content-Disposition:
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/xml:
              schema:
                type: string
                format: binary
        "400":
          description: Resource unavailable or request rejected
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Resource unavailable or request rejected
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: Resource unavailable or request rejected
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Resource unavailable or request rejected
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: Document not authorized
        "429":
          $ref: "#/components/responses/TrafficLimited"
        "503":
          $ref: "#/components/responses/TemporarilyUnavailable"
  /api/v1/documents/{documentId}/ride-job:
    get:
      tags:
        - 5. Consultar y descargar
      operationId: readRideJob
      summary: Consultar la generación del PDF
      description: Requires artifacts:read and an active tenant owning the document. A
        missing job returns 404. PDF generation failures preserve fiscal
        authorization. This operation never submits documents to the SRI.
      security:
        - bearerAuth: []
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Durable job status
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                type: object
                required:
                  - state
                  - attempts
                  - nextAttemptAt
                properties:
                  state:
                    type: string
                    enum:
                      - PENDING
                      - RUNNING
                      - COMPLETED
                      - DEAD
                      - BLOCKED
                  attempts:
                    type: integer
                    minimum: 0
                  nextAttemptAt:
                    type: string
                    format: date-time
                  failureCategory:
                    type: string
                    nullable: true
                    enum:
                      - TRANSIENT
                      - VALIDATION
                      - INTEGRITY
                      - EXTERNAL_UNKNOWN
                      - PERMANENT
        "401":
          description: Authentication required
        "403":
          description: Scope missing or tenant inactive
        "404":
          description: Resource unavailable
        "429":
          $ref: "#/components/responses/TrafficLimited"
        "503":
          $ref: "#/components/responses/TemporarilyUnavailable"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    TokenRequest:
      type: object
      additionalProperties: false
      required:
        - clientId
        - clientSecret
      properties:
        clientId:
          type: string
          minLength: 1
          maxLength: 100
        clientSecret:
          type: string
          format: password
          minLength: 1
          maxLength: 500
          writeOnly: true
    TokenResponse:
      type: object
      additionalProperties: false
      required:
        - accessToken
        - tokenType
        - expiresIn
      properties:
        accessToken:
          type: string
          description: Short-lived RS256 JWT
        tokenType:
          type: string
          enum:
            - Bearer
        expiresIn:
          type: integer
          format: int64
          minimum: 1
          example: 900
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri
        code:
          type: string
    FiscalConfigurationRequest:
      type: object
      required:
        - taxpayer
        - establishment
        - pointOfIssue
      properties:
        taxpayer:
          $ref: "#/components/schemas/CreateTaxpayerRequest"
        establishment:
          $ref: "#/components/schemas/CreateEstablishmentRequest"
        pointOfIssue:
          $ref: "#/components/schemas/CreatePointOfIssueRequest"
    CreateTaxpayerRequest:
      type: object
      additionalProperties: false
      required:
        - ruc
        - legalName
        - mainAddress
      properties:
        ruc:
          type: string
          maxLength: 13
          pattern: ^[0-9]{13}$
          minLength: 1
        legalName:
          type: string
          maxLength: 300
          minLength: 1
        tradeName:
          type: string
          maxLength: 300
        mainAddress:
          type: string
          maxLength: 300
          minLength: 1
    CreateEstablishmentRequest:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
          maxLength: 3
          pattern: ^[0-9]{3}$
          minLength: 1
        name:
          type: string
          maxLength: 200
        address:
          type: string
          maxLength: 500
    CreatePointOfIssueRequest:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
          maxLength: 3
          pattern: ^[0-9]{3}$
          minLength: 1
        name:
          type: string
          maxLength: 200
    FiscalConfigurationResult:
      type: object
      required:
        - taxpayerId
        - establishmentId
        - pointOfIssueId
        - environment
      properties:
        taxpayerId:
          type: string
          format: uuid
        establishmentId:
          type: string
          format: uuid
        pointOfIssueId:
          type: string
          format: uuid
        environment:
          type: string
          enum:
            - TEST
    FiscalConfigurationEntry:
      type: object
      properties:
        taxpayerId:
          type: string
          format: uuid
        ruc:
          type: string
        legalName:
          type: string
        tradeName:
          type: string
          nullable: true
        mainAddress:
          type: string
          nullable: true
        taxpayerStatus:
          type: string
        testEnabled:
          type: boolean
        productionEnabled:
          type: boolean
        establishmentId:
          type: string
          format: uuid
          nullable: true
        establishmentCode:
          type: string
          nullable: true
        establishmentAddress:
          type: string
          nullable: true
        establishmentStatus:
          type: string
          nullable: true
        pointOfIssueId:
          type: string
          format: uuid
          nullable: true
        pointOfIssueCode:
          type: string
          nullable: true
        pointOfIssueStatus:
          type: string
          nullable: true
        certificateId:
          type: string
          format: uuid
          nullable: true
        certificateStatus:
          type: string
          nullable: true
        certificateValidUntil:
          type: string
          format: date-time
          nullable: true
    CreateInvoiceRequest:
      type: object
      additionalProperties: false
      required:
        - pointOfIssueId
        - environment
        - issuedAt
        - buyer
        - items
        - payments
      properties:
        pointOfIssueId:
          type: string
          format: uuid
        environment:
          type: string
          enum:
            - TEST
        issuedAt:
          type: string
          format: date-time
        customerId:
          type: string
          format: uuid
          nullable: true
        buyer:
          $ref: "#/components/schemas/InvoiceBuyer"
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/InvoiceItem"
        payments:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/InvoicePayment"
        expectedTotal:
          type: number
          format: double
          minimum: 0
          multipleOf: 0.01
          nullable: true
          description: |
            Optional client-side verification value.
            Emitta calculates the authoritative total.
    InvoiceBuyer:
      type: object
      additionalProperties: false
      required:
        - identificationType
        - identification
        - name
      properties:
        identificationType:
          type: string
          pattern: ^[0-9]{2}$
        identification:
          type: string
          minLength: 1
          maxLength: 30
        name:
          type: string
          minLength: 1
          maxLength: 300
        email:
          type: string
          format: email
          maxLength: 320
          nullable: true
        address:
          type: string
          maxLength: 500
          nullable: true
    InvoiceItem:
      type: object
      additionalProperties: false
      required:
        - description
        - quantity
        - unitPrice
        - discount
        - taxes
      properties:
        sku:
          type: string
          maxLength: 25
          nullable: true
        description:
          type: string
          minLength: 1
          maxLength: 300
        quantity:
          type: number
          exclusiveMinimum: 0
        unitPrice:
          type: number
          minimum: 0
        discount:
          type: number
          minimum: 0
          multipleOf: 0.01
        taxes:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/InvoiceTax"
    InvoiceTax:
      type: object
      additionalProperties: false
      required:
        - taxCode
        - percentageCode
        - rate
      properties:
        taxCode:
          type: string
          pattern: ^[0-9]{1,4}$
        percentageCode:
          type: string
          pattern: ^[0-9]{1,4}$
        rate:
          type: number
          minimum: 0
    InvoicePayment:
      type: object
      additionalProperties: false
      required:
        - paymentMethod
        - total
      properties:
        paymentMethod:
          type: string
          pattern: ^[0-9]{2}$
        total:
          type: number
          exclusiveMinimum: 0
          multipleOf: 0.01
        term:
          type: number
          minimum: 0
          nullable: true
        unitTime:
          type: string
          minLength: 1
          maxLength: 10
          nullable: true
    CreateInvoiceResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - status
        - total
        - created
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/DocumentStatus"
        total:
          type: number
          multipleOf: 0.01
        created:
          type: boolean
          description: |
            true when this request created the invoice.
            false when this response is an idempotent replay.
    DocumentStatus:
      type: string
      enum:
        - RECEIVED
        - QUEUED
        - GENERATING
        - SIGNED
        - SUBMITTED
        - RETRY_PENDING
        - AUTHORIZED
        - REJECTED
        - FAILED
  responses:
    TrafficLimited:
      description: Configured traffic bucket exhausted. Independent of monthly
        commercial quotas.
      headers:
        Retry-After:
          description: Minimum delay in seconds before a new request.
          schema:
            type: integer
            minimum: 1
        Cache-Control:
